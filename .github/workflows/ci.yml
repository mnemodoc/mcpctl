---
name: CI

# Binary-project variant of ci.yml: identical, plus the
# build_static_binaries job. Use this one when the project ships binaries
# (docker-bake.hcl + Dockerfile + Makefile.release + a release:static task);
# use ci.yml for a library shard, which has no static build.
# Any change common to both must be made in ci.yml first.

permissions: {}

# crystalline is the Crystal LSP server, only needed in an editor.
# Its macOS binary (>= 0.18.0) is dynamically linked against
# /opt/homebrew/opt/llvm/lib/libLLVM.dylib, which is absent on the runners,
# so the plugin post_install check fails. CI never uses it, so skip installing it.
# The value must be the tool name exactly as declared in mise.toml. Shortening it
# to `crystalline` matches nothing: mise disables no tool, and the macOS jobs fail
# again on the post_install check.
env:
  MISE_DISABLE_TOOLS: aqua:elbywan/crystalline

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - "**.md"
  pull_request:
    branches:
      - '**'
    paths-ignore:
      - "**.md"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Git checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Check formatting
        run: mise dev:format-check

  ameba:
    runs-on: ubuntu-24.04
    steps:
      - name: Git checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: mise dev:deps

      - name: Run static code analysis
        run: mise dev:ameba

  docs:
    runs-on: ubuntu-24.04
    steps:
      - name: Git checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: mise dev:deps

      - name: Build API docs
        run: mise dev:docs

  # The release path (Dockerfile + Makefile.release + docker-bake.hcl) is
  # otherwise only exercised on a tag push, i.e. during the release itself: a
  # break there ships a release short of a platform. Building it here moves the
  # failure back to the pull request.
  build_static_binaries:
    runs-on: ubuntu-24.04
    steps:
      - name: Git checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Build static binaries
        run: mise release:static

  test_linux_amd64:
    runs-on: ubuntu-24.04
    steps:
      - name: Git checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: mise dev:deps

      - name: Run tests
        run: mise dev:spec

      - name: Run tests (multi-threaded)
        run: mise dev:spec-mt

      # Project-specific, not in the template: mcpctl reads secrets on Linux
      # through secret-tool, so a real Secret Service is the only way to check
      # what it hands back. Linux runners only — macOS has no Secret Service.
      - name: Install the Secret Service stack
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsecret-tools gnome-keyring dbus

      - name: Run the Secret Service integration spec
        run: mise dev:spec-secret-tool

  test_linux_arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Git checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: mise dev:deps

      - name: Run tests
        run: mise dev:spec

      - name: Run tests (multi-threaded)
        run: mise dev:spec-mt

      # Project-specific, not in the template: mcpctl reads secrets on Linux
      # through secret-tool, so a real Secret Service is the only way to check
      # what it hands back. Linux runners only — macOS has no Secret Service.
      - name: Install the Secret Service stack
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsecret-tools gnome-keyring dbus

      - name: Run the Secret Service integration spec
        run: mise dev:spec-secret-tool

  # Best-effort early warning against the Crystal nightly compiler, allowed to
  # fail. mise ships no nightly build, so the container provides the compiler
  # and mise is used for its tasks alone: MISE_DISABLE_TOOLS deactivates the
  # pinned crystal, and the tasks then resolve `crystal` from PATH — the
  # container's. Job-level env REPLACES the workflow-level one, so crystalline
  # has to be repeated here or mise would try to install it.
  #
  # Going through the tasks is what makes this job mean anything: they carry the
  # `depends` that generate whatever the compilation needs (headers, baked
  # folders). Called raw, `crystal spec` can die at require time, and the canary
  # then reports nothing but its own misconfiguration.
  test_nightly_linux:
    runs-on: ubuntu-24.04
    continue-on-error: true
    container: crystallang/crystal:nightly
    env:
      MISE_DISABLE_TOOLS: crystal,aqua:elbywan/crystalline
    steps:
      - name: Git checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The nightly image is a bare Ubuntu: no curl and no ca-certificates, so
      # mise-action has nothing to fetch mise with. Add here whatever else the
      # project's own tasks shell out to.
      - name: Provision the container
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl

      - name: Setup mise
        uses: jdx/mise-action@v4

      # Kept raw rather than `mise dev:deps`: the flags skip building the
      # development executables, which a nightly compiler routinely fails to
      # build — and that failure would mask the regression this job watches.
      - name: Install dependencies
        run: shards install --skip-postinstall --skip-executables

      - name: Run tests
        run: mise dev:spec

      - name: Run tests (multi-threaded)
        run: mise dev:spec-mt

  test_macos_arm64:
    runs-on: macos-26
    steps:
      - name: Git checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@v4

      # macOS ships no `timeout`, which the mise tasks use to bound anything
      # that can spin forever (ameba, the multi-threaded spec run). The tasks
      # are written in GNU syntax on purpose; gnubin puts the GNU names first
      # so they need no macOS branch. `brew --prefix` covers both arm64
      # (/opt/homebrew) and Intel (/usr/local).
      - name: Install GNU coreutils
        run: |
          brew install coreutils
          echo "$(brew --prefix)/opt/coreutils/libexec/gnubin" >> "$GITHUB_PATH"

      # TODO: remove me when https://github.com/crystal-lang/crystal/issues/16746 is fixed
      - name: Fix Crystal shards
        run: mise dev:fix-shards-command

      - name: Install dependencies
        run: mise dev:deps

      - name: Run tests
        run: mise dev:spec

      - name: Run tests (multi-threaded)
        run: mise dev:spec-mt

  test_macos_amd64:
    runs-on: macos-26-intel
    steps:
      - name: Git checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@v4

      # macOS ships no `timeout`, which the mise tasks use to bound anything
      # that can spin forever (ameba, the multi-threaded spec run). The tasks
      # are written in GNU syntax on purpose; gnubin puts the GNU names first
      # so they need no macOS branch. `brew --prefix` covers both arm64
      # (/opt/homebrew) and Intel (/usr/local).
      - name: Install GNU coreutils
        run: |
          brew install coreutils
          echo "$(brew --prefix)/opt/coreutils/libexec/gnubin" >> "$GITHUB_PATH"

      # TODO: remove me when https://github.com/crystal-lang/crystal/issues/16746 is fixed
      - name: Fix Crystal shards
        run: mise dev:fix-shards-command

      - name: Install dependencies
        run: mise dev:deps

      - name: Run tests
        run: mise dev:spec

      - name: Run tests (multi-threaded)
        run: mise dev:spec-mt
